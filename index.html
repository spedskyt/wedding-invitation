
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리의 결혼식에 초대합니다</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f8f5ef;
      color: #554c43;
      font-family: "Noto Serif KR", serif;
      text-align: center;
    }
    main {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 90px 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .line {
      width: 40px;
      border-top: 1px solid #b7a58e;
      margin: 30px auto;
    }
    h1 {
      font-size: 28px;
      font-weight: 400;
      line-height: 1.7;
    }
    p {
      font-size: 15px;
      line-height: 2;
    }
    .date {
      margin-top: 35px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <main>
    <p>OUR WEDDING DAY</p>
    <div class="line"></div>
    <h1>서로의 하루가 되어<br>평생을 함께하겠습니다.</h1>
    <p>저희 두 사람의 새로운 시작에<br>소중한 분들을 초대합니다.</p>
    <div class="line"></div>
    <p class="date">2027. 02. 20 SATURDAY</p>
    <p>오후 1시 30분</p>
    <div class="line"></div>
    <p>저희 결혼식에 초대합니다.</p>
  </main>
</body>
</html>
